name: Build Executables

# Single-executable distributions (Node SEA). ONE ubuntu job builds ALL host
# exes via `build-exe.cjs --all` (downloads official node dists, postject
# cross-injects) — per-OS runner builds proved fragile (macOS kernel-killed
# post-injection binaries, Windows Next webpack EPERM), and SEA injection does
# not require running the target binary. The macOS artifact is re-signed
# ad-hoc on a real macOS runner before release (injection invalidates the
# dist signature). Docker images are built by docker-publish.yml on the tags.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality-gate.yml

  build:
    name: SEA exe (all hosts)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite unflagged — SEA has no better-sqlite3
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build Next.js standalone (traced into CLI payload)
        run: npm run build
        env:
          NEXT_TRACING_ROOT_MODE: workspace

      - name: Assemble CLI payload (cli/app)
        run: node cli/scripts/build-cli.js
        env:
          NEXT_TRACING_ROOT_MODE: workspace

      - name: Build all host executables (SEA cross-inject)
        run: node scripts/sea/build-exe.cjs --all

      - name: Smoke — serve and poll the dashboard (linux exe)
        shell: bash
        run: |
          PORT=20199 dist-sea/ExtremeRouter-linux-x64 --serve &
          SERVER_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "http://127.0.0.1:20199/"; then
              echo "dashboard reachable after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" = "60" ]; then
              echo "::error::dashboard never became reachable"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
          done
          kill $SERVER_PID 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sea-exes
          path: |
            dist-sea/ExtremeRouter-windows-x64.exe
            dist-sea/ExtremeRouter-linux-x64
            dist-sea/ExtremeRouter-macos-arm64
          if-no-files-found: error
          retention-days: 7

  sign-macos:
    name: Re-sign macOS exe (ad-hoc)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sea-exes
          path: dist-sea

      - name: Strip invalidated signature, re-sign ad-hoc, smoke --version
        run: |
          BIN=dist-sea/ExtremeRouter-macos-arm64
          chmod +x "$BIN"
          codesign --remove-signature "$BIN" || true
          codesign -s - "$BIN"
          codesign --verify "$BIN"
          OUT=$("$BIN" --version) || {
            echo "::error::macOS exe failed after re-sign"
            exit 1
          }
          echo "version output: $OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sea-exes-signed
          path: dist-sea/ExtremeRouter-macos-arm64
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach executables to release
    needs: [build, sign-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sea-exes
          path: dist-sea

      - uses: actions/download-artifact@v4
        with:
          name: sea-exes-signed
          path: dist-sea

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist-sea
          gh release upload "$TAG" dist-sea/ExtremeRouter-* --clobber --repo "$GITHUB_REPOSITORY"
