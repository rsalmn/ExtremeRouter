name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  # GHCR requires lowercase repository names; github.repository renders
  # "rsalmn/ExtremeRouter" as-is, which breaks buildx cache refs.
  GHCR_IMAGE: ghcr.io/rsalmn/extremerouter
  DOCKERHUB_IMAGE: rsalmn/extremerouter

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality-gate.yml

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

  # Docker Hub does not read the repo README — its overview page is a
  # separate resource. After every image push, PATCH the repository
  # description/full_description via the Docker Hub v2 API so the page
  # stays in sync with the repo docs.
  # Description updates are non-critical (the image is already pushed): a
  # failed PATCH (e.g. token scope limits) must not turn the workflow red.
  update-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs: build-and-push
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: PATCH repository description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ env.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail

          # Skip when Docker Hub secrets are not configured (e.g. forks).
          # Secrets are not accessible in job-level if conditionals, so the
          # guard lives here where env vars are available.
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "Docker Hub credentials not configured — skipping description update"
            exit 0
          fi

          # Exchange credentials for a JWT (Docker Hub v2 API).
          TOKEN="$(curl -fsS -X POST "https://hub.docker.com/v2/users/login/" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r '.token')"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Docker Hub login failed — no JWT token returned"
            exit 1
          fi

          # Build the JSON payload with jq (safe escaping of markdown).
          jq -n \
            --arg description "Self-hosted AI gateway: 304+ providers, format translation, smart fallback, quota tracking, 20-40% token savings." \
            --arg full_description "$(cat .github/docker-hub-description.md)" \
            '{description: $description, full_description: $full_description}' \
            > /tmp/dh-description.json

          # PATCH the repository overview.
          curl -fsS -X PATCH "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/" \
            -H "Authorization: JWT ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/dh-description.json

          echo "Docker Hub description updated for ${DOCKERHUB_REPO}"
